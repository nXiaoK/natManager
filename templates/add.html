{% extends "base.html" %}
{% block title %}添加 NAT 转发规则{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">添加 NAT 转发规则</h1>
    <form method="post">
        <div class="form-group">
            <label for="ip_version">IP 版本：</label>
            <select name="ip_version" class="form-control" id="ip_version">
                <option value="4">IPv4</option>
                <option value="6">IPv6</option>
            </select>
        </div>
        <div class="form-group">
            <label for="protocol">协议：</label>
            <select name="protocol" class="form-control" id="protocol">
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
            </select>
        </div>
        <div class="form-group">
            <label for="dport">目的端口：(多个端口用逗号分隔，如：80,443,22)</label>
            <input type="text" name="dport" class="form-control" id="dport" required placeholder="例如：80,443,22">
        </div>
        
        <div class="form-group">
            <label for="target_id">目标地址：</label>
            <select name="target_id" class="form-control" id="target_id" onchange="toggleTargetFields()">
                <option value="">-- 手动输入IP --</option>
                {% for target in targets %}
                <option value="{{ target.id }}">{{ target.name }} ({{ target.ip }}) 
                    {% if target.status == '在线' %}[在线]{% elif target.status == '离线' %}[离线]{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div id="manual_ip_div">
            <div class="form-group">
                <label for="to_ip">目标 IP：</label>
                <input type="text" name="to_ip" class="form-control" id="to_ip" placeholder="如果选择了目标地址，此项可忽略">
            </div>
        </div>
        
        <div class="form-group">
            <label for="to_port">目标端口：(多个端口用逗号分隔，数量应与目的端口一致)</label>
            <input type="text" name="to_port" class="form-control" id="to_port" required placeholder="例如：8080,4433,2222">
        </div>
        
        <!-- 可选：添加启用开关 -->
        <div class="form-group form-check">
            <input type="checkbox" name="enabled" class="form-check-input" id="enabled" checked>
            <label class="form-check-label" for="enabled">启用此规则</label>
        </div>
        <button type="submit" class="btn btn-success">添加规则</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">返回</a>
    </form>
</div>

<script>
    function toggleTargetFields() {
        var targetId = document.getElementById('target_id').value;
        var manualIpDiv = document.getElementById('manual_ip_div');
        var toIpField = document.getElementById('to_ip');
        
        if (targetId) {
            manualIpDiv.style.display = 'none';
            toIpField.required = false;
        } else {
            manualIpDiv.style.display = 'block';
            toIpField.required = true;
        }
    }
    
    // 页面加载时执行
    document.addEventListener('DOMContentLoaded', function() {
        toggleTargetFields();
    });
</script>
{% endblock %}
